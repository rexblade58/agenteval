[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agenteval"
version = "0.2.0"
description = "Open source agent evaluation and battle platform - make AI agents prove their code works"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Menard Rosal", email = "menardrush@gmail.com" }]
keywords = ["ai", "agents", "llm", "evaluation", "benchmark", "observability", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "httpx>=0.24,<1.0",
    "rich>=13.0",
    "pyyaml>=6.0",
]

[project.scripts]
agenteval = "agenteval.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools]
packages = ["agenteval", "agenteval.arena"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["fixtures", "node_modules", "dist", ".git"]
