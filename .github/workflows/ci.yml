name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e "packages/core[dev]"
      - name: Run tests
        run: pytest packages/core/tests -v --cov=agenteval --cov-report=term-missing
      - name: Verify CLI
        run: agenteval run --provider mock --suite all

  test-ts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install
        run: cd packages/sdk-ts && npm install
      - name: Typecheck
        run: cd packages/sdk-ts && npx tsc --noEmit
      - name: Test
        run: cd packages/sdk-ts && npx vitest run
